[project]
name = "crafty-mcp-server"
version = "0.1.0"
description = "Standalone MCP server for controlling Crafty Controller-hosted Minecraft worlds"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.0",
    "aiohttp==3.14.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio"]

[project.scripts]
crafty-mcp-server = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
