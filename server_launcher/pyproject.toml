[project]
name = "server_launcher"
description = "Tkinter desktop launcher for this repo's dev servers"
version = "0.1.0"
requires-python = ">=3.11"
# stdlib + tkinter only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
