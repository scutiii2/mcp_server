# ZimaOS "Install a customized app" - combined Docker Compose for
# mcp_server + chat_app as ONE app install.
#
# This merges mcp_server/zima_host.yaml and chat_app/zima_host.yaml. Use
# this instead of the two separate files if you'd rather manage both
# containers as a single ZimaOS app (one entry to start/stop/redeploy,
# and chat_app reaches mcp_server over the compose network instead of
# your LAN IP). Downside: redeploying one service (e.g. to pick up a
# code change) restarts both, since ZimaOS treats the whole file as one
# app. If you want independent lifecycles, use the two separate files
# instead.
#
# Setup:
#   1) Copy mcp_server/'s contents (everything EXCEPT venv_mcp/, .env,
#      __pycache__) to one folder on your ZimaOS storage, and
#      chat_app/'s contents (everything EXCEPT venv_chat/, .env,
#      __pycache__) to a second folder.
#   2) Edit both volume paths below to point at those folders.
#   3) Fill in every [PLACE ... HERE] placeholder below.
#   4) App Store -> Install a customized app -> paste this whole file ->
#      Install.
#
# Both services land on the same Compose-managed network automatically
# (no explicit `networks:` needed), so chat_app can reach mcp_server by
# its SERVICE name (`mcp_server`) rather than a LAN IP - that's why
# MCP_SERVER_URL below differs from the two-file version.

version: '3.8'
services:
  mcp_server:
    # slim (glibc), not alpine (musl) - paramiko pulls in `cryptography`,
    # a compiled dependency that reliably has prebuilt wheels for glibc
    # but not always for musl, which means a from-source build (needing
    # a C/Rust toolchain nothing here installs) instead of a plain
    # `pip install`.
    image: python:3.13-slim
    container_name: mcp-server
    volumes:
      # EDIT THIS: wherever you copied mcp_server's contents to on the NAS.
      - "/media/YOUR-HDD/mcp_server:/app"
    working_dir: /app
    entrypoint: ["sh", "-c", "pip install . && python -m mcp_server.run"]
    restart: always
    ports:
      - "8010:8010"
    environment:
      # MCP_HOST must be 0.0.0.0, not the .env.example default of
      # 127.0.0.1 - "loopback" means loopback INSIDE this container,
      # which the `ports:` mapping above can never reach from outside.
      #
      # This server has NO authentication of its own (see its own
      # startup banner's WARNING line about this) - anything that can
      # reach port 8010 can run every registered tool with arguments of
      # its choosing. Binding 0.0.0.0 is what makes the port mapping
      # work at all, so restrict who can reach it at the NETWORK level
      # instead (NAS firewall rule / VLAN / don't forward this port
      # past your LAN) - nothing at the app level will.
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8010
      - CONFIG_PATH=/app/config.json
      - MCP_LOG_DIR=/app/logs
      - PENDING_REQUESTS_PATH=/app/pending_requests.db
      - OTP_PATH=/app/otp.db
      # Only matters for approval-gated capabilities (an emailed
      # approve/deny link) - this one is read by whatever mail client
      # opens the link, not by chat_app, so it still needs your NAS's
      # real LAN IP/hostname, not the compose service name.
      - MCP_PUBLIC_BASE_URL=http://[YOUR NAS LAN IP OR HOSTNAME]:8010
      # "reject" (default) needs a real known_hosts file with your SSH
      # hosts' keys already in it - mount or create one at this path, or
      # switch to "auto" to trust-on-first-use instead.
      - SSH_HOST_KEY_POLICY=reject
      - SSH_KNOWN_HOSTS=/app/known_hosts
      # Only needed if config.json actually references ${SMTP_PASSWORD}
      # / ${DESKTOP_SSH_PASSWORD} - delete whichever line you don't use,
      # a ${VAR} that resolves to empty fails startup on purpose (see
      # .env.example).
      - SMTP_PASSWORD=[PLACE YOUR SMTP APP PASSWORD HERE]
      - DESKTOP_SSH_PASSWORD=[PLACE YOUR SSH PASSWORD HERE]

  chat_app:
    # slim (glibc), not alpine (musl) - same reasoning as mcp_server:
    # pydantic_core is a compiled dependency, and glibc has more
    # reliable prebuilt-wheel coverage than musl.
    image: python:3.13-slim
    container_name: chat-app
    depends_on:
      # Starts mcp_server's container first. Not a readiness wait (pip
      # install still has to finish inside it), so chat_app's extension
      # sidebar may show empty for the first several seconds after a
      # fresh install/restart - it degrades gracefully and doesn't crash.
      - mcp_server
    volumes:
      # EDIT THIS: wherever you copied chat_app's contents to on the NAS.
      - "/media/YOUR-HDD/chat_app:/app"
    working_dir: /app
    entrypoint: ["sh", "-c", "pip install . && python -m chat_app.run"]
    restart: always
    ports:
      - "5009:5009"
    environment:
      # FLASK_HOST must be 0.0.0.0, not the .env.example default of
      # 127.0.0.1 - "loopback" means loopback INSIDE this container,
      # which the `ports:` mapping above can never reach from outside.
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5009
      # REQUIRED once FLASK_HOST is 0.0.0.0, not optional the way it is
      # locally: security.py's loopback-only fallback checks the
      # CONNECTING address, and a request arriving through Docker's
      # port mapping never looks like 127.0.0.1 - without these, every
      # request gets a permanent 403 "not configured for network
      # access", not just unauthenticated ones.
      # Once the gate is on, this pair isn't the only thing that passes
      # it: any registered user's own account password, and any currently-
      # valid gate code (minted from the Account manager), also work.
      - CHAT_AUTH_USER=[PLACE A USERNAME HERE]
      - CHAT_AUTH_PASSWORD=[PLACE A PASSWORD HERE]
      # REQUIRED for the same reason - the Host header of a request to
      # your NAS's IP/hostname isn't "localhost" either, so it's
      # rejected unless listed here (comma-separated for more than one).
      # This is the browser-facing address, so it still needs your real
      # LAN IP/hostname - the compose service name only resolves
      # container-to-container, not from your laptop's browser.
      - CHAT_ALLOWED_HOSTS=[YOUR NAS LAN IP OR HOSTNAME]
      # Alternative to CHAT_AUTH_USER/PASSWORD above, not needed alongside
      # them: set CHAT_NETWORK_ACCESS_ENABLED=1 instead if you'd rather
      # require real per-person account logins for every request than a
      # shared pair. See .env.example for the full explanation.
      # The account that always exists - log in as it once to generate
      # invite codes for everyone else (see /register). Required: chat_app
      # refuses to start without it if no other accounts exist yet.
      - ADMIN_USERNAME=[PLACE AN ADMIN USERNAME HERE]
      - ADMIN_PASSWORD=[PLACE AN ADMIN PASSWORD HERE]
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
      # Left unset, a random one is generated at every container
      # restart, which signs everyone out each time - set a real value
      # so sessions survive a restart.
      - FLASK_SECRET_KEY=[PLACE A GENERATED SECRET HERE]
      - CHATS_DB_PATH=/app/data/chats.db
      - USERS_DB_PATH=/app/data/users.db
      - CHAT_LOG_DIR=/app/logs
      # Both services are in this same compose file, so they share a
      # Docker network and can reach each other by SERVICE name - no
      # LAN IP needed here, unlike the two-separate-app version.
      - MCP_SERVER_URL=http://mcp_server:8010/mcp
      # Optional - only if you use the Ollama provider. Point at your
      # Ollama host's LAN address, never 127.0.0.1/localhost (that's
      # this container's own loopback, not your Ollama machine's).
      - OLLAMA_BASE_URL=http://[YOUR OLLAMA HOST]:11434/v1
      # Optional - leave unset to grey those providers out rather than
      # fail when selected.
      - OPENAI_API_KEY=[PLACE YOUR OPENAI KEY HERE, OR DELETE]
      - ANTHROPIC_API_KEY=[PLACE YOUR ANTHROPIC KEY HERE, OR DELETE]
