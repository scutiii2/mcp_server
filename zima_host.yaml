version: '3.8'
services:
  mcp_server:
    image: python:3.13-slim
    container_name: mcp-server
    volumes:
      - "/media/HDD320-1/MCPArchitecture/mcp_server:/app"
    working_dir: /app
    entrypoint: ["sh", "-c", "pip install . && python -m run"]
    restart: always
    ports:
      - "8010:8010"
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8010"
      MCP_PUBLIC_BASE_URL: "http://127.0.0.1:8010"
      SMTP_PASSWORD: "@98paFne1jK23"
      SSH_HOST_KEY_POLICY: "reject"

  chat_app:
    image: python:3.13-slim
    container_name: chat-app
    depends_on:
      - mcp_server
    volumes:
      - "/media/HDD320-1/MCPArchitecture/chat_app:/app"
    working_dir: /app
    entrypoint: ["sh", "-c", "pip install . && python -m run"]
    restart: always
    ports:
      - "5009:5009"
    environment:
      SECRET_KEY: "chatapp"
      BOOTSTRAP_ADMIN_USERNAME: "root"
      BOOTSTRAP_ADMIN_EMAIL: "scutiii.code@gmail.com"
      BOOTSTRAP_ADMIN_PASSWORD: "@pMF98q32w"
      OPENAI_MODEL: "gpt-5.6-sol"
      CLAUDE_MODEL: "claude-sonnet-5"
      MCP_SERVER_URL: "http://mcp_server:8010/mcp"
      OLLAMA_BASE_URL: "http://scutiserver1.local:11434/v1"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USERNAME: "root"
      SMTP_PASSWORD: "@a98sEfn2"
      SMTP_USE_TLS: "true"
