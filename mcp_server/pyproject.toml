[project]
# The distribution and console-script name. The importable package stays
# `mcp_server` (see the wheel target below) - a dist name differing from
# the module it installs is normal in Python, and renaming the package
# would touch every import for no benefit.
name = "ember-mcp-server"
version = "0.1.0"
description = "Ember MCP tool server"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "paramiko==5.0.0",
    "uvicorn==0.49.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ember-mcp-server = "mcp_server.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]