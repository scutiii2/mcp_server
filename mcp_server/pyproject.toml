[project]
name = "sap-mcp-server"
version = "0.1.0"
description = "SAP AIOps MCP tool server"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "paramiko==5.0.0",
    "uvicorn==0.49.0",
    "python-dotenv==1.2.2",
    "hdbcli>=2.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sap-mcp-server = "mcp_server.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
