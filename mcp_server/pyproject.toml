[project]
# The distribution and console-script name. The importable package is
# `src` (see the wheel target below), matching chat_app's layout - a
# dist name differing from the module it installs is normal in Python.
name = "mcp_server"
version = "0.1.0"
description = "MCP tool server"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "paramiko==5.0.0",
    "uvicorn==0.49.0",
    "python-dotenv==1.2.2",
    "aiohttp==3.14.3",
    # Starlette's Request.form() needs this to parse the multipart body
    # POST /upload receives (upload_routes.py) - without it, that call
    # raises rather than parsing the uploaded file.
    "python-multipart==0.0.32",
    # server_manager talks to the host Docker daemon.
    "docker>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-server = "src.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]