[project]
name = "chat_cli"
version = "0.1.0"
description = "Terminal chat client for ember_api"
requires-python = ">=3.11"
dependencies = [
    # ember_api's REST and Server-Sent Events API.
    "httpx>=0.27,<1.0",
    # Markdown and live rendering of the streamed answer.
    "rich>=13.7",
    # The prompt: history, Ctrl+C / Ctrl+D, hidden password input.
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
chat-cli = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
