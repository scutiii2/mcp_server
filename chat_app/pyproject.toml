[project]
name = "chat_app"
description = "MCP Chat App"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "Flask-Login>=0.6",
    "Flask-Session>=0.8",
    "Flask-SQLAlchemy>=3.1",
    "Flask-WTF>=1.2",
    "Flask-Mail>=0.9",
    "python-dotenv>=1.0",
    "mcp>=1.28.0,<2.0.0",
    # Only for services/mcp_client.py's upload_file() - a multipart POST
    # to mcp_server's /upload isn't worth hand-building with stdlib
    # urllib, unlike every other mcp_client.py call. Already installed
    # transitively via mcp/anthropic/openai; declared explicitly rather
    # than relying on that.
    "httpx>=0.27,<1.0",
    "pydantic>=2.13.4",
    "pydantic_core>=2.46.4",
    # Upper bound matches what's actually installed (openai 3.3.1,
    # anthropic 1.0.0) - both crossed a major version past this range's
    # old unbounded floor, which is how the venv silently landed on a
    # breaking SDK generation (new httpx2/httpcore2-based transport)
    # without pyproject.toml ever saying so. Raise deliberately, not by
    # a bare `pip install --upgrade` drifting past it again.
    "openai>=2.43.0,<4.0.0",
    "anthropic>=0.121.0,<2.0.0",
    # Chat file-attachment text extraction (services/text_extraction.py).
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
