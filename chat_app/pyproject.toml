[project]
name = "authtemplate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "Flask-Login>=0.6",
    "Flask-Session>=0.8",
    "Flask-SQLAlchemy>=3.1",
    "Flask-WTF>=1.2",
    "Flask-Mail>=0.9",
    "python-dotenv>=1.0",
    "mcp>=1.28.0,<2.0.0",
    "pydantic>=2.13.4",
    "pydantic_core>=2.46.4",
    "openai>=2.43.0",
    "anthropic>=0.121.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
