[project]
name = "sap-chat-app"
version = "0.1.0"
description = "SAP AIOps chat interface and MCP capabilities browser"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "mcp==1.28.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "openai==2.43.0",
    "anthropic>=0.40",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
sap-ai-hub = ["sap-ai-sdk-gen>=6.6.0"]

[project.scripts]
sap-chat-app = "chat_app.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_app"]
