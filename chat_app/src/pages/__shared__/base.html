<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}AuthTemplate{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='shared.css') }}">
</head>
<body>
  <div class="toast-container">
    {% with messages = get_flashed_messages(with_categories=True) %}
      {% for category, message in messages %}
      <div class="toast{% if category == 'persistent' %} toast-persistent{% endif %}">
        <span>{{ message }}</span>
        <button type="button" class="toast-close" aria-label="Dismiss">&times;</button>
      </div>
      {% endfor %}
    {% endwith %}
  </div>
  {% block sidebar %}{% endblock %}
  <main{% if page_layout == "centered" %} class="main-centered"{% endif %}>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='shared.js') }}"></script>
</body>
</html>
