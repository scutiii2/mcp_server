<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SAP AIOps chat</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    #log { min-height: 300px; border: 1px solid #e2e2e2; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    .msg { margin-bottom: 12px; white-space: pre-wrap; }
    .msg.user { font-weight: 500; }
    #row { display: flex; gap: 8px; }
    #q { flex: 1; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 8px 16px; border: none; background: #1a1a1a; color: white; border-radius: 6px; cursor: pointer; }
    a.caps-link { font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <p><a class="caps-link" href="/capabilities">View MCP server capabilities →</a></p>
  <div id="log"></div>
  <div id="row">
    <input id="q" type="text" placeholder="Ask about a SAP system...">
    <button onclick="send()">Send</button>
  </div>

  <script>
    const history = [];
    async function send() {
      const input = document.getElementById('q');
      const question = input.value.trim();
      if (!question) return;
      input.value = '';
      appendMsg('user', question);
      history.push({ role: 'user', content: question });

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, history }),
      });
      const data = await res.json();
      appendMsg('assistant', data.response);
      history.push({ role: 'assistant', content: data.response });
    }

    function appendMsg(role, text) {
      const log = document.getElementById('log');
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = (role === 'user' ? 'You: ' : '') + text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    document.getElementById('q').addEventListener('keydown', e => {
      if (e.key === 'Enter') send();
    });
  </script>
</body>
</html>
