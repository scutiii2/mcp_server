<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SAP AIOps chat</title>
  <link rel="stylesheet" href="{{ url_for('chat.static', filename='styles.css') }}">
</head>
<body>
  <div class="toprow">
    <a class="caps-link" href="/capabilities">View MCP server capabilities →</a>
    <div class="selectors">
      <select id="model" class="hidden"><option>—</option></select>
      <select id="provider"><option>Loading providers...</option></select>
    </div>
  </div>
  <div id="log"></div>
  <div id="row">
    <input id="q" type="text" placeholder="Ask about a SAP system...">
    <button onclick="send()">Send</button>
  </div>

  <script src="{{ url_for('chat.static', filename='script.js') }}"></script>
</body>
</html>
