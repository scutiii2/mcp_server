<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Log in - MCP chat app</title>
  <link rel="stylesheet" href="{{ url_for('auth.static', filename='styles.css') }}">
</head>
<body>
  <h1>Log in</h1>
  <p class="sub">Sign in to use the chat app.</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post" action="{{ url_for('auth.login_submit') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>

  <p class="alt-link">Have an invite code? <a href="{{ url_for('auth.register_page') }}">Register</a></p>
</body>
</html>
