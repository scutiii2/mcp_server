<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register - MCP chat app</title>
  <link rel="stylesheet" href="{{ url_for('auth.static', filename='styles.css') }}">
</head>
<body>
  <h1>Register</h1>
  <p class="sub">Registration requires an invite code from an existing user.</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post" action="{{ url_for('auth.register_submit') }}">
    <label for="invite_code">Invite code</label>
    <input type="text" id="invite_code" name="invite_code" autocomplete="off" required autofocus>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Create account</button>
  </form>

  <p class="alt-link">Already have an account? <a href="{{ url_for('auth.login_page') }}">Log in</a></p>
</body>
</html>
