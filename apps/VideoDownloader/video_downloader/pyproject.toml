[project]
name = "video_downloader"
description = "Downloads videos and audio from public sites with yt-dlp. REST API for video_downloader_web, MCP endpoint for mcp_server."
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "mcp>=1.28.0,<2.0.0",
    # Pinned: site extractors break often; update deliberately with update.bat.
    # curl-cffi: browser impersonation (TikTok and others need it). Every curl_cffi request is
    # address-checked and IP-pinned by src/policy/curl_guard.py.
    "yt-dlp[default,curl-cffi]==2026.8.19",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: reaches real websites; run with -m live"]
addopts = "-m \"not live\""
